# 邮件自测 / 连接信息重发 —— **不开云机**。
#
# 为什么要这个：
#   0c1 的邮件只有开机流程才会发 —— 想验证「邮件能不能到 / 内容对不对」就得开一台云机，
#   代价太大（几分钟到几十分钟，还占账号池）。这个 workflow 在 GitHub 托管的 windows runner
#   上跑一遍（几分钟、不占云机），真的把邮件发出去；也用来「把某台机器的连接信息重发一次」。
#
# 用法：Actions → 「Mail Test (0c1 连接信息)」→ Run workflow
#   install_uu = true   真装 UU远程 再发（约 3 分钟，邮件内容完整：设备 ID + 验证码）
#   install_uu = false  跳过安装，只测发信链路（约 30 秒；连接信息会显示「未取到」）
#   dry_run    = true   只渲染邮件内容、不真发（排查 SMTP 配置用）
#   conn_ip    = 非空时 → **只重发「连接信息」邮件**（RDP：Tailscale IP / 账号 / 密码），不跑 0c1。
#               例：conn_ip=100.106.159.80 conn_user=a conn_pass=a
#               它用本仓库的 MAIL_* Secrets + 仓库里**当前**的 send-mail.ps1 发（所以改完脚本立刻能验证）。
#
# 复用与 0e / 0c1 完全相同的 MAIL_* Secrets —— 这里通，开机那封就通。
#
# ⚠️ 0c1 那一路只验证「发信链路」。这台是 GitHub 托管运行器，**不是账户 a 的云机** ——
#    邮件里的「机器」会显示「单跑测试（GitHub 托管运行器，非账户 a 的云机）」。
#    账户 a 的真机连接信息由 windows-rdp.yml 的 0c1 发出（机器 = github-rdp-server-N + 100.x）。
name: Mail Test (0c1 连接信息)

on:
  workflow_dispatch:
    inputs:
      install_uu:
        description: 'true = 真装 UU远程 再发（~3 分钟，内容完整）；false = 跳过安装只测发信（~30 秒）'
        required: false
        default: 'true'
      dry_run:
        description: 'true = 只渲染邮件内容不真发（排查 SMTP 用）'
        required: false
        default: 'false'
      conn_ip:
        description: '非空 = 只重发「连接信息」邮件（填 Tailscale IP，如 100.106.159.80）；留空则跑 0c1'
        required: false
        default: ''
      conn_user:
        description: 'conn_ip 非空时：用户名（默认 a）'
        required: false
        default: 'a'
      conn_pass:
        description: 'conn_ip 非空时：密码（默认 a）'
        required: false
        default: 'a'
      uu_device:
        description: '可选：UU远程 设备 ID —— 填了就并进同一封邮件（备用通道段）'
        required: false
        default: ''
      uu_code:
        description: '可选：UU远程 连接码'
        required: false
        default: ''
      uu_machine:
        description: '可选：UU远程 机器标识，如 github-rdp-server (100.x)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mail-test
  cancel-in-progress: true

jobs:
  mail:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
      MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
      MAIL_SECURITY: ${{ secrets.MAIL_SECURITY }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_CC: ${{ secrets.MAIL_CC }}
      # 自定义验证码（8~16 位、字母+数字都要有）。仓库变量没设就用脚本默认 a1234567。
      CLOUDRDP_UU_CODE: ${{ vars.CLOUDRDP_UU_CODE }}
      # ★ 机器标识：这台是 GitHub 托管运行器，**不是账户 a 的云机**（没接 Tailscale、没建账户 a）。
      #   直接写明，免得又把随机运行器名（runnervmXXXX）误当成「账户 a 的连接信息」。
      #   真机的连接信息（账户 a · github-rdp-server-N (100.x)）由开机流程 windows-rdp.yml 的 0c1 发出。
      CLOUDRDP_UU_MACHINE: '单跑测试（GitHub 托管运行器，非账户 a 的云机）'
      RDP_USERNAME: a
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 重发「连接信息」邮件（conn_ip 非空时）
        if: ${{ inputs.conn_ip != '' }}
        shell: pwsh
        run: |
          $sys = 'D:\cloudrdp-sys'
          New-Item -ItemType Directory -Force -Path "$sys\_state" | Out-Null
          $env:CLOUDRDP_SYS_DIR = $sys
          # ⚠️ 必须用**哈希表** splat：数组 splat（@('-Ip','x')）是**按位置**绑定的，
          #    '-Ip' 会被当成位置参数的值 —— 真机实测「A positional parameter cannot be found」。
          # 可选：把 UU 段写进 _state\uu-remote.json，让这封「连接信息」邮件带上备用通道
          if ('${{ inputs.uu_device }}' -ne '') {
            @{ machine = '${{ inputs.uu_machine }}'; deviceId = '${{ inputs.uu_device }}'; customCode = '${{ inputs.uu_code }}' } |
              ConvertTo-Json | Set-Content -LiteralPath "$sys\_state\uu-remote.json" -Encoding UTF8
          }
          $h = @{ Ip = '${{ inputs.conn_ip }}'; LogPath = "$sys\_state\connmail.log" }
          if ('${{ inputs.conn_user }}' -ne '') { $h.User = '${{ inputs.conn_user }}' }
          if ('${{ inputs.conn_pass }}' -ne '') { $h.Pass = '${{ inputs.conn_pass }}' }
          if ('${{ inputs.dry_run }}' -eq 'true') { $h.DryRun = $true }
          .\scripts\send-connection-mail.ps1 @h

      - name: 0c1 连接信息 + 发信（单跑）
        if: ${{ inputs.conn_ip == '' }}
        shell: pwsh
        run: |
          $sys = 'D:\cloudrdp-sys'
          New-Item -ItemType Directory -Force -Path "$sys\_state" | Out-Null
          $env:CLOUDRDP_SYS_DIR = $sys
          # ⚠️ 同上：哈希表 splat，别用数组 splat（数组是位置绑定 → -LogPath 会被当位置值）。
          $h = @{ LogPath = "$sys\_state\uu-remote.log"; Mail = $true }   # -Mail：默认不发，单测要发
          if ('${{ inputs.install_uu }}' -ne 'true') { $h.SkipInstall = $true }
          if ('${{ inputs.dry_run }}' -eq 'true')    { $h.DryRun = $true }
          .\scripts\install-uu-remote.ps1 @h

      - name: 回显状态与 SMTP 对话（Actions 日志里直接看）
        if: always()
        shell: pwsh
        run: |
          $sys = 'D:\cloudrdp-sys'
          foreach ($f in @("$sys\_state\uu-remote.log", "$sys\_state\uu-remote.json",
                           "$sys\_state\connmail.log")) {
            if (Test-Path -LiteralPath $f) { "===== $f ====="; Get-Content -LiteralPath $f -Raw }
          }

      - name: 断言「邮件到底发出去没有」（发信失败就把这一步弄红）
        if: always()
        shell: pwsh
        run: |
          $sys = 'D:\cloudrdp-sys'
          $log = (@("$sys\_state\uu-remote.log", "$sys\_state\connmail.log") |
                    Where-Object { Test-Path -LiteralPath $_ } |
                    ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join "`n"
          if ('${{ inputs.dry_run }}' -eq 'true') { Write-Host 'DRY RUN —— 只渲染，不判定发信结果'; exit 0 }
          if ($log -match '已发送：')      { Write-Host '✅ 邮件已发送（见日志「已发送：<收件人>」）'; exit 0 }
          if ($log -match '未配置 ')       { Write-Host '⚠️ 仓库没配 MAIL_* Secrets —— 视为「未启用邮箱」，不是失败'; exit 0 }
          if ($log -match 'FAILED 阶段=')  { Write-Host '❌ 发信失败，失败阶段见上面日志'; exit 1 }
          Write-Host '❌ 日志里既没有「已发送」也没有失败记录 —— 大概率脚本没跑到发信那步'; exit 1

      - name: 上传状态/日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uu-0c1-state
          path: D:\cloudrdp-sys\_state\
          if-no-files-found: warn
          retention-days: 7
