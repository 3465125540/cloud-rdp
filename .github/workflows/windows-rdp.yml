name: Windows Cloud RDP

# 手动触发 + 定时（北京时间；GitHub cron 一律用 UTC）
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: '保活时长（分钟）。默认 350；快速测试可填 5'
        required: false
        default: '350'
  schedule:
    # 早场：北京 8:30 开机（UTC 00:30）→ 跑到 11:30（UTC 03:30）
    - cron: '30 0 * * *'
    # 午场：北京 13:30 开机（UTC 05:30）→ 跑到 17:30（UTC 09:30）
    - cron: '30 5 * * *'

# 防止重复触发堆积
concurrency:
  group: cloud-rdp
  cancel-in-progress: false

# 账号密码直接写死（私有仓库内可见；按用户要求不走 Secret）
env:
  RDP_USERNAME: NvdAdmin
  RDP_PASSWORD: "Rdp@2026#Nvd"
  # 手动触发 = 跑满 5h50m（可用 duration_minutes 覆盖）；定时触发 = 跑到所在窗口结束
  IS_MANUAL: "${{ github.event_name == 'workflow_dispatch' }}"
  INPUT_DURATION: "${{ inputs.duration_minutes }}"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360          # GitHub 免费账户单 Job 上限 6 小时
    permissions:                  # 最小权限：拉代码 + 读 run 历史（估额度）
      contents: read
      actions: read

    steps:
      - name: 0. 拉取仓库
        uses: actions/checkout@v4

      - name: 1. 开启远程桌面 + 放行防火墙
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. 创建管理员账号 + 桌面快捷方式
        shell: powershell
        run: |
          $sec = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USERNAME -Password $sec -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          "RDP_USER=$env:RDP_USERNAME" | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          # 公共桌面放一个指向同步目录的快捷方式，避免把文件存到不会被同步的地方
          try {
            New-Item -ItemType Directory -Force -Path "C:\data" | Out-Null
            $ws = New-Object -ComObject WScript.Shell
            $lnk = $ws.CreateShortcut("$env:PUBLIC\Desktop\CloudData.lnk")
            $lnk.TargetPath = "C:\data"
            $lnk.Description = "与 139 云盘自动同步的目录"
            $lnk.Save()
            Write-Host "已创建桌面快捷方式: CloudData -> C:\data"
          } catch { Write-Host "创建桌面快捷方式失败: $_" }

      - name: 3. 安装并连接 Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) { throw "缺少 Secret: TAILSCALE_AUTHKEY" }
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4 | Select-Object -First 1).Trim()
          "TS_IP=$ts_ip" | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: 4. 生成 AList 管理员密码（本机专用）
        shell: powershell
        run: |
          $chars = (48..57) + (65..90) + (97..122)
          $pass = -join ($chars | Get-Random -Count 24 | ForEach-Object { [char]$_ })
          "ALIST_ADMIN_PASS=$pass" | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: 5. 安装并配置 rclone
        shell: powershell
        run: .\scripts\setup-rclone.ps1

      - name: 6. 部署 AList 并挂载 139 云盘
        shell: powershell
        env:
          ALIST_139_AUTHORIZATION: ${{ secrets.ALIST_139_AUTHORIZATION }}
        run: .\scripts\setup-alist.ps1

      - name: 7. 从 139 云盘拉取数据
        shell: powershell
        run: .\scripts\sync-down.ps1

      - name: 8. 估算额度 + 打印连接信息
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
        run: |
          & .\scripts\quota-report.ps1
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $env:TS_IP" -ForegroundColor Yellow
          Write-Host "  Username     : $env:RDP_USER" -ForegroundColor Yellow
          Write-Host "  Password     : $env:RDP_PASSWORD" -ForegroundColor Yellow
          $rs = $env:RESTORE_STATUS
          if ([string]::IsNullOrWhiteSpace($rs)) { $rs = "UNKNOWN" }
          $rc = "DarkGray"
          if ($rs -eq "OK") { $rc = "Green" } elseif ($rs -eq "FAILED") { $rc = "Red" }
          Write-Host "  数据恢复     : $rs   (C:\data 已与 139 云盘同步)" -ForegroundColor $rc
          if ($rs -eq "FAILED") {
            Write-Host "  !! 恢复失败：139 Authorization 可能已过期，C:\data 当前为空，别在上面存重要东西 !!" -ForegroundColor Red
          }
          $qp = $env:QUOTA_LEFT_PCT
          if (-not [string]::IsNullOrWhiteSpace($qp)) {
            $qi = [int]$qp
            $qc = "DarkGray"
            if ($qi -le 20) { $qc = "Red" } elseif ($qi -le 50) { $qc = "Yellow" }
            $src = $env:QUOTA_SOURCE
            if ($src -eq "billing-api") { $src = "官方API" }
            elseif ($src -eq "run-history") { $src = "本仓库估算" }
            Write-Host "  Actions 额度 : 剩余 $qi%  (≈$($env:QUOTA_LEFT_MIN) 分钟 / $src)" -ForegroundColor $qc
            if ($qi -le 20) {
              Write-Host "  !! 额度告急：只剩 $($env:QUOTA_LEFT_MIN) 分钟，定时任务随时静默停摆，次月 1 号才重置 !!" -ForegroundColor Red
            }
          }
          Write-Host "  >> 打开 mstsc，连接上面的 Tailscale IP" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 9. 保活（定时场跑到窗口结束；手动场默认 350 分钟）
        shell: powershell
        run: |
          $now = (Get-Date).ToUniversalTime()
          if ($env:IS_MANUAL -eq "true") {
              $mins = 350
              if (-not [string]::IsNullOrWhiteSpace($env:INPUT_DURATION)) {
                  $parsed = 0
                  if ([int]::TryParse($env:INPUT_DURATION, [ref]$parsed) -and $parsed -gt 0) { $mins = $parsed }
              }
              $stop = $now.AddMinutes($mins)
              Write-Host "[keepalive] 手动触发：保活 $mins 分钟，预计 $($stop.ToString('HH:mm')) UTC 结束"
          } else {
              $d  = $now.Date
              $b1 = $d.AddHours(3).AddMinutes(30)      # 11:30 北京
              $b2 = $d.AddHours(9).AddMinutes(30)      # 17:30 北京
              if     ($now -lt $b1) { $stop = $b1 }
              elseif ($now -lt $b2) { $stop = $b2 }
              else                  { $stop = $now.AddMinutes(60) }
              Write-Host "[keepalive] 定时触发：跑到 $($stop.ToString('HH:mm')) UTC 自动停止"
          }
          $n = 0
          while ((Get-Date).ToUniversalTime() -lt $stop) {
              Start-Sleep -Seconds 60
              $n++
              $left = [int](($stop - (Get-Date).ToUniversalTime()).TotalMinutes)
              Write-Host "[$n] server running... 剩余 $left 分钟"
              if ($n % 10 -eq 0) { & .\scripts\sync-up.ps1 }
          }
          Write-Host "[keepalive] 已到窗口结束时间，开始收尾"

      - name: 10. 收尾全量同步到 139 云盘
        if: always()
        shell: powershell
        run: .\scripts\sync-up.ps1
