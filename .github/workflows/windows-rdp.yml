name: Windows Cloud RDP

# 手动触发 + 定时（北京时间；GitHub cron 一律用 UTC）
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: '保活时长（分钟）。默认 350；快速测试可填 5'
        required: false
        default: '350'
      install_apps:
        description: '还原后是否后台自动重装软件（true/false）'
        required: false
        default: 'true'
      migrate_139:
        description: '是否把 139 老路径(/CloudRDP,/_snapshot)迁移到 AI文件库 下（true/false）'
        required: false
        default: 'false'
      slim_image:
        description: '开机瘦身（删镜像自带大件，约释放 70GB）：auto/always/off'
        required: false
        default: 'auto'
      chinese:
        description: '开机设置简体中文 + 微软拼音输入法：on/off'
        required: false
        default: 'on'
      relay_minutes:
        description: '接力总时长（分钟）：单 job 上限 6 小时，填 2880 可借接力续到 48 小时。0 = 不接力'
        required: false
        default: '0'
      # ---------- 账号池（留空 = 单机模式，行为与历史版本完全一致）----------
      pool_role:
        description: '账号池角色：primary（写139）/standby（只读热备）。留空 = 单机'
        required: false
        default: ''
      pool_owner:
        description: '本机所属 GitHub 账号（owner）。留空则用仓库 owner 兜底'
        required: false
        default: ''
      pool_hub:
        description: '池协调器所在仓库 owner/repo（读取权威角色）。留空 = 单机'
        required: false
        default: ''
      pool_id:
        description: '池标识（仅用于日志/状态标记）。留空 = 单机'
        required: false
        default: ''
  schedule:
    # 早场：北京 8:30 开机（UTC 00:30）→ 跑满 6 小时
    - cron: '30 0 * * *'
    # 午场：北京 13:30 开机（UTC 05:30）→ 跑满 6 小时
    - cron: '30 5 * * *'

# 防止重复触发堆积
concurrency:
  group: cloud-rdp
  cancel-in-progress: false

# actions: write —— 保活接力（relay-next.ps1）需要用 GITHUB_TOKEN 触发下一个 run。
# 不接力时这个权限也不会造成额外暴露。
permissions:
  contents: read
  actions: write

# 账号密码直接写死（按需求：日志里明文打印，方便直接取用）
# ⚠️ 本仓库是公开的 —— 这两个值会永久留在 git 历史与公开日志里，这是刻意的取舍：
#    机器只能经 Tailscale 内网访问，tailnet 才是真正的安全边界，密码只当第二道门。
env:
  RDP_USERNAME: a
  RDP_PASSWORD: "a"
  # ---------- 路径常量（唯一事实源，脚本以 $env: 读取并各有内置兜底）----------
  # 数据目录：⚠️ 它是 Actions 工作区的父目录，仓库 checkout 就在它下面（D:\a\cloud-rdp\cloud-rdp），
  #           sync-up/sync-down 会自动排除该子目录，避免把仓库传上云盘。
  CLOUDRDP_DATA_DIR: 'D:\a\cloud-rdp'
  # 139 侧根：数据 = $base/CloudRDP，快照 = $base/_snapshot
  CLOUDRDP_REMOTE_BASE: 'alist:/cloudrdp/AI文件库'
  # 可移动程序暂存目录（位于数据目录内，随数据管线高频同步）
  CLOUDRDP_PORTABLE_DIR: 'D:\a\cloud-rdp\_portable'
  # ---------- 系统目录：rclone / AList / 快照暂存 / 程序还原 全部放 D 盘 ----------
  # C 盘只保留 runner 镜像自带内容（VS / Android SDK / 工具缓存，约 120GB / 150GB）；
  # 我们产生的一切都落 D 盘（150GB，几乎全空），并由 disk-guard.ps1 守住增量 ≤30%。
  CLOUDRDP_SYS_DIR: 'D:\cloudrdp-sys'
  # 本地快照暂存（放 D 盘：① 不占 C 盘 ② 脚本护栏要求路径含 _snapshot ③ 不在数据目录内，避免被 sync-up 二次上传）
  CLOUDRDP_SNAPSHOT_STAGE: 'D:\cloudrdp-sys\_snapshot'
  # 安装型程序还原根：C 盘紧张时程序实体落这里，原安装路径用 junction 指过来（C 盘零增长但原路径可用）
  CLOUDRDP_PROGRAMS_DIR: 'D:\cloudrdp-sys\programs'
  # 手动触发 = 跑满 5h50m（可用 duration_minutes 覆盖）；定时触发 = 跑到所在窗口结束
  IS_MANUAL: "${{ github.event_name == 'workflow_dispatch' }}"
  INPUT_DURATION: "${{ inputs.duration_minutes }}"
  INPUT_INSTALL_APPS: "${{ inputs.install_apps }}"
  INPUT_MIGRATE_139: "${{ inputs.migrate_139 }}"
  INPUT_SLIM: "${{ inputs.slim_image }}"
  INPUT_CHINESE: "${{ inputs.chinese }}"
  # 接力：>0 表示本轮跑满后自动触发下一个 run，直到累计够这么多分钟（单 job 上限 6 小时，靠接力续命）
  INPUT_RELAY_MINUTES: "${{ inputs.relay_minutes }}"
  # ---------- 账号池 ----------
  # pool_role 非空即进入「池模式」。角色由 hub 协调器派发时指定；standby 会读 hub 权威状态自升为主。
  INPUT_POOL_ROLE: "${{ inputs.pool_role }}"
  INPUT_POOL_OWNER: "${{ inputs.pool_owner }}"
  INPUT_POOL_HUB: "${{ inputs.pool_hub }}"
  INPUT_POOL_ID: "${{ inputs.pool_id }}"
  # hub 发布权威状态的分支/路径（spoke 用 raw.githubusercontent 匿名读取）
  POOL_STATE_BRANCH: 'pool-state'
  POOL_STATE_PATH: 'state/pool-state.json'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360          # GitHub 免费账户单 Job 上限 6 小时
    permissions:                  # 最小权限：拉代码 + 读 run 历史（估额度）
      contents: read
      actions: read

    steps:
      - name: 0. 拉取仓库
        # v5 = Node 24 runtime，消除 GitHub「Node.js 20 is deprecated」警告（v4 跑在 Node 20）
        uses: actions/checkout@v5
      - name: 0p. 跟随上游 hub 同步脚本（fork 自愈，永不跑旧逻辑）
        # ⚠️ 为什么必须有这一步：fork 的 scripts/ **不会**自动跟随上游。
        #    acc-1 就是因为 fork 停在旧版，把「139 DNS 抖了几秒」误判成「远端没有数据」，
        #    结果一个文件都没拉回来、还反手把空壳推回 139（详见 remote-lib.ps1 头部说明）。
        #    这里在**任何业务脚本执行之前**，把 hub 的最新 scripts/ 覆盖进工作区 ——
        #    以后改脚本只需改 hub，所有机器下次开机自动生效，不必逐个维护 fork。
        # 无需 PAT：公开仓库可匿名下载。失败不影响开机（保留本地脚本继续跑）。
        continue-on-error: true
        shell: pwsh
        env:
          HUB_FROM_VAR: ${{ vars.CLOUDRDP_HUB }}
        run: |
          $hub = [string]$env:HUB_FROM_VAR
          if ([string]::IsNullOrWhiteSpace($hub)) { $hub = [string]$env:POOL_HUB }
          if ([string]::IsNullOrWhiteSpace($hub)) { $hub = '3465125540/cloud-rdp' }   # 默认 hub；可用仓库变量 CLOUDRDP_HUB 覆盖
          $parts = $hub.Split('/')
          if ($parts.Count -lt 2) { Write-Host "[upstream] hub 坐标非法：$hub —— 跳过"; exit 0 }
          $hubOwner = $parts[0]; $hubRepo = $parts[1]

          if ("$env:GITHUB_REPOSITORY" -ieq $hub) { Write-Host "[upstream] 本仓库就是 hub（$hub）—— 无需同步"; exit 0 }

          # 优先本仓库所在分支名，其次 main/master（hub 上不一定有同名分支）
          $refs = @($env:GITHUB_REF_NAME, 'main', 'master') | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
          $zip  = Join-Path $env:RUNNER_TEMP 'hub-src.zip'
          $ok   = $false
          foreach ($ref in $refs) {
              try {
                  Invoke-WebRequest "https://codeload.github.com/$hubOwner/$hubRepo/zip/refs/heads/$ref" `
                      -OutFile $zip -UseBasicParsing -ErrorAction Stop
                  $ok = $true; Write-Host "[upstream] 已下载 hub 源码：$hub@$ref"; break
              } catch { Write-Host "[upstream] 下载 $ref 失败：$($_.Exception.Message)" }
          }
          if (-not $ok) { Write-Host "[upstream] 无法下载 hub 源码 —— 保留本地脚本继续（不影响开机）"; exit 0 }

          $dest = Join-Path $env:RUNNER_TEMP 'hub-src'
          if (Test-Path -LiteralPath $dest) { Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue }
          try { Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force -ErrorAction Stop }
          catch { Write-Host "[upstream] 解压失败：$($_.Exception.Message) —— 保留本地脚本继续"; exit 0 }
          $root = (Get-ChildItem -LiteralPath $dest -Directory | Select-Object -First 1).FullName
          $srcScripts = Join-Path $root 'scripts'
          if (-not (Test-Path -LiteralPath $srcScripts)) { Write-Host "[upstream] hub 包里没有 scripts/ —— 跳过"; exit 0 }

          # /MIR = 镜像同步（含删除上游已移除的旧脚本），保证两边完全一致
          $dstScripts = Join-Path $env:GITHUB_WORKSPACE 'scripts'
          robocopy $srcScripts $dstScripts /MIR /NFL /NDL /NJH /NJS /NP /R:1 /W:1 | Out-Null
          $copied = @(Get-ChildItem -LiteralPath $dstScripts -File -ErrorAction SilentlyContinue).Count
          $hasLib = Test-Path -LiteralPath (Join-Path $dstScripts 'remote-lib.ps1')
          Write-Host "[upstream] scripts/ 已同步自 $hub —— $copied 个文件，remote-lib.ps1=$hasLib"
          if (-not $hasLib) { Write-Host "[upstream] ⚠️ 上游脚本里没有 remote-lib.ps1 —— 本次将退化为旧判定逻辑" }
      - name: 0a. 记录 job 起点 + 开启远程桌面 + 关闭 Windows 防火墙
        shell: pwsh
        run: |
          # job 起点时间戳：backup-snapshot.ps1 用它算 ETA / 剩余时间预算。
          # 必须尽早写（不能等到瘦身之后），否则 ETA 会偏乐观。
          New-Item -ItemType Directory -Force -Path (Join-Path $env:CLOUDRDP_SYS_DIR '_state') | Out-Null
          (Get-Date).ToUniversalTime().ToString('o') | Out-File (Join-Path $env:CLOUDRDP_SYS_DIR '_state\job-start.txt') -Encoding ascii
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # 关闭 Windows 防火墙（Domain/Private/Public）—— 镜像现在默认开启，会拦掉 SMB(445)/AList(5244) 等
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled False -ErrorAction SilentlyContinue
          Write-Host ("[fw] 防火墙状态: " + ((Get-NetFirewallProfile | ForEach-Object { "$($_.Name)=$($_.Enabled)" }) -join ' '))
      - name: 0b. 创建管理员账号 + 数据目录 + 桌面快捷方式
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) { throw "缺少 RDP_USERNAME" }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw "缺少 RDP_PASSWORD" }
          $sec = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $created = $false
          try {
            New-LocalUser -Name $env:RDP_USERNAME -Password $sec -PasswordNeverExpires -ErrorAction Stop | Out-Null
            $created = $true
          } catch {
            if ($_.Exception.Message -match 'already exists') {
              Set-LocalUser -Name $env:RDP_USERNAME -Password $sec -ErrorAction SilentlyContinue
              $created = $true
            } else {
              # 多半是本地密码策略拒绝（例如单字符密码）—— 一次性机器，放宽策略无副作用
              Write-Host "[0b] 建账号被拒，尝试放宽本地密码策略：$($_.Exception.Message)"
              $inf = Join-Path $env:TEMP 'secpol-rdp.inf'
              $sdb = Join-Path $env:TEMP 'secpol-rdp.sdb'
              & "$env:SystemRoot\System32\secedit.exe" /export /cfg $inf /quiet | Out-Null
              $txt = [regex]::Replace((Get-Content -LiteralPath $inf -Raw -Encoding Unicode), 'PasswordComplexity\s*=\s*\d', 'PasswordComplexity = 0')
              $txt = [regex]::Replace($txt, 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0')
              Set-Content -LiteralPath $inf -Value $txt -Encoding Unicode
              & "$env:SystemRoot\System32\secedit.exe" /configure /db $sdb /cfg $inf /areas SECURITYPOLICY /quiet | Out-Null
              New-LocalUser -Name $env:RDP_USERNAME -Password $sec -PasswordNeverExpires -ErrorAction Stop | Out-Null
              $created = $true
              Write-Host "[0b] 已放宽密码策略，账号创建成功"
            }
          }
          if (-not $created) { throw "创建管理员账号失败" }
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Write-Host "[0b] 账号就绪: $env:RDP_USERNAME"
          "RDP_USER=$env:RDP_USERNAME" | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          # 数据目录 + 可移动程序暂存目录（公共桌面放快捷方式，避免把文件存到不会被同步的地方）
          try {
            $dataDir = $env:CLOUDRDP_DATA_DIR
            New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
            New-Item -ItemType Directory -Force -Path $env:CLOUDRDP_PORTABLE_DIR | Out-Null
            $ws = New-Object -ComObject WScript.Shell
            $lnk = $ws.CreateShortcut("$env:PUBLIC\Desktop\CloudData.lnk")
            $lnk.TargetPath = $dataDir
            $lnk.Description = "与 139 云盘自动同步的目录"
            $lnk.Save()
            Write-Host "已创建桌面快捷方式: CloudData -> $dataDir"
          } catch { Write-Host "创建桌面快捷方式失败: $_" }
      - name: 0c. 安装并连接 Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) { throw "缺少 Secret: TAILSCALE_AUTHKEY" }
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          # up 是异步的（协商 authkey + 注册控制平面），但退出码能反映「命令是否被接受」。
          # 失败（authkey 无效/过期/网络不通）时立刻报错，别让后面拿不到 IP 时崩溃得莫名其妙。
          & $ts up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) {
              throw "tailscale up 失败（返回码 $LASTEXITCODE）—— 检查 TAILSCALE_AUTHKEY 是否有效/过期"
          }

          # 轮询等 IP 就绪：机器要几秒~几十秒才能拿到 100.x IP（state 从 NoState -> Running）。
          # 之前固定 Start-Sleep 8 秒就 ip -4，赶上注册慢时 ip -4 返回空 → $null.Trim() 直接崩整个 job。
          $ts_ip = ''
          $ipDeadline = (Get-Date).ToUniversalTime().AddSeconds(90)
          while ((Get-Date).ToUniversalTime() -lt $ipDeadline) {
              Start-Sleep -Seconds 5
              $raw = (& $ts ip -4 2>$null | Select-Object -First 1)
              if ($raw) {
                  $ts_ip = ([string]$raw).Trim()
                  if ($ts_ip) { break }
              }
          }
          if ([string]::IsNullOrWhiteSpace($ts_ip)) {
              $st = (& $ts status 2>&1 | Out-String)
              throw ("90 秒内没拿到 Tailscale IP（state={0}）—— 可能 authkey 失效或网络受限" -f $st.Trim())
          }
          Write-Host "[0c] Tailscale IP: $ts_ip"
          "TS_IP=$ts_ip" | Out-File $env:GITHUB_ENV -Append -Encoding ascii

          # 「可连」时刻：供 0d 打印拿到 IP 的耗时、13 打印就绪总耗时
          (Get-Date).ToUniversalTime().ToString('o') | Out-File (Join-Path $env:CLOUDRDP_SYS_DIR '_state\rdp-ready-at.txt') -Encoding ascii
      - name: 0c2. 解析账号池角色（primary / standby / 单机）
        shell: pwsh
        run: |
          # pool_role 留空 = 单机模式（与历史行为完全一致，向后兼容）。
          # 非空 = 池模式：本机初始角色由 hub 派发时指定。
          #   * primary —— 唯一写 139（用户数据 + 整机快照）
          #   * standby —— 只读热备：持续重拉保持与主一致，不写 139；主下线后读 hub 权威状态自升为主
          $role = [string]$env:INPUT_POOL_ROLE
          if ([string]::IsNullOrWhiteSpace($role)) { $role = 'standalone' }
          $role = $role.Trim().ToLowerInvariant()
          if ($role -notin @('primary', 'standby', 'standalone')) { $role = 'standalone' }

          $hub    = ([string]$env:INPUT_POOL_HUB).Trim()
          $poolId = ([string]$env:INPUT_POOL_ID).Trim()
          $owner  = ([string]$env:INPUT_POOL_OWNER).Trim()
          if ([string]::IsNullOrWhiteSpace($owner)) { $owner = [string]$env:GITHUB_REPOSITORY_OWNER }

          # 池模式必须同时有角色 + hub 坐标，否则退回单机（绝不让半配置把机器卡死）
          $pooled = ($role -ne 'standalone') -and (-not [string]::IsNullOrWhiteSpace($hub))
          if (-not $pooled) { $role = 'standalone' }

          $stateDir = Join-Path $env:CLOUDRDP_SYS_DIR '_state'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $roleFile = Join-Path $stateDir 'pool-role.txt'
          $role | Out-File -LiteralPath $roleFile -Encoding ascii
          if ($pooled) {
              @(
                "pool_id=$poolId"
                "pool_hub=$hub"
                "pool_owner=$owner"
                "assigned_role=$role"
                "role_file=$roleFile"
              ) | Out-File -LiteralPath (Join-Path $stateDir 'pool-info.txt') -Encoding ascii
          }

          "POOL_ROLE=$role"                              | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          "POOL_OWNER=$owner"                            | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          "POOL_HUB=$hub"                                | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          "POOL_ID=$poolId"                              | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          "POOL_MODE=$(if ($pooled) { 'pool' } else { 'standalone' })" | Out-File $env:GITHUB_ENV -Append -Encoding ascii

          $desc = switch ($role) {
            'primary' { '主 —— 唯一写 139（数据 + 整机快照）' }
            'standby' { '备 —— 只读热备：持续重拉，不写 139；主下线即自升为主' }
            default   { '单机 —— 未启用账号池，行为同历史版本' }
          }
          Write-Host "[pool] 角色 = $role  —— $desc"
          if ($pooled) { Write-Host "[pool] hub = $hub   owner = $owner   pool_id = $poolId" }
      - name: 0d. 打印连接信息（可立即连接）
        shell: pwsh
        run: |
          $sysDir    = $env:CLOUDRDP_SYS_DIR
          $startFile = Join-Path $sysDir '_state\job-start.txt'
          $elapsed   = '?'
          if (Test-Path -LiteralPath $startFile) {
            try {
              $st = [datetime]::Parse((Get-Content -LiteralPath $startFile -Raw).Trim()).ToUniversalTime()
              $elapsed = [math]::Round(((Get-Date).ToUniversalTime() - $st).TotalMinutes, 1)
            } catch { }
          }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP 现在就能连（环境仍在后台初始化）<<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $env:TS_IP" -ForegroundColor Yellow
          Write-Host "  Username     : $env:RDP_USER" -ForegroundColor Yellow
          Write-Host "  Password     : $env:RDP_PASSWORD" -ForegroundColor Yellow
          Write-Host "  拿到 IP 耗时 : $elapsed 分钟" -ForegroundColor DarkGray
          Write-Host ""
          Write-Host "  >> 打开 mstsc，连接上面的 Tailscale IP" -ForegroundColor Magenta
          Write-Host "  >> 看不到 IP 时：https://login.tailscale.com/admin/machines 找 github-rdp-server*" -ForegroundColor DarkGray
          Write-Host ""
          Write-Host "  [后台仍在进行] C盘瘦身 -> 数据/桌面恢复 -> 中文环境 -> 软件重装" -ForegroundColor DarkYellow
          Write-Host "    预计 30~60 分钟（取决于 139 云盘速度，实测约 0.45 MB/s）" -ForegroundColor DarkGray
          Write-Host "    想用满血环境，等日志出现 【ENV READY】 再登录更稳妥；" -ForegroundColor DarkGray
          Write-Host "    现在登录也能用，但数据 / 桌面 / 中文输入法可能还在恢复中。" -ForegroundColor DarkGray
          Write-Host "==========================================" -ForegroundColor Green

          # 公共桌面放标记文件（用户人在 RDP 里，看不到 Actions 日志）
          try {
            $marker = Join-Path $env:PUBLIC 'Desktop\_CloudRDP_SETTING_UP.txt'
            @(
              "环境初始化中 ..."
              ""
              "Tailscale IP : $env:TS_IP"
              "Username     : $env:RDP_USER"
              "Password     : $env:RDP_PASSWORD"
              ""
              "后台仍在进行：C盘瘦身 -> 数据/桌面恢复 -> 中文环境 -> 软件重装"
              "初始化完成后，本文件会改名为 _CloudRDP_READY.txt"
            ) | Out-File -LiteralPath $marker -Encoding UTF8
          } catch { Write-Host "写桌面标记文件失败: $_" }
      - name: 0e. 把连接信息发到邮箱（未配置邮箱则自动跳过）
        continue-on-error: true
        shell: pwsh
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SECURITY: ${{ secrets.MAIL_SECURITY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
        run: |
          # 账号密码按用户要求写死在 workflow（明文打印、方便直接取用）。
          # 同时主动发一封到用户邮箱，省得每次去翻 Actions 日志。
          # 正文写在脚本里（不放 YAML here-string，免得被 YAML 缩进规则坑）。
          # 未配置 MAIL_* 时脚本会打印提示并 exit 0 —— 不会让开机失败。
          # -LogPath：发信失败会被 continue-on-error 静默吞掉，落盘才查得到原因。
          .\scripts\send-connection-mail.ps1 -LogPath "$env:CLOUDRDP_SYS_DIR\_state\mail.log"
      # ---------------------------------------------------------------- 提前启动中文环境
      # 为什么放在瘦身之前：Install-Language 要联网下载 FoD 语言包，实测每次 30~43 分钟，
      # 是整个开机流程里最慢的一步。提到最前面，它就能在后面瘦身/拉数据/还原的
      # ~40 分钟里悄悄装完，而开机流程一步都不多等。
      #
      # ⚠️ 2026-09-23 复盘（run 35813312970，每次必超时）—— 老版有两个硬伤：
      #   ① 超时预算算错了：0f 步 timeout-minutes=6（360s），而脚本里「同步等语言包」
      #      就写死 300s，加上系统 locale 2s + 用户 hive 33s + 增强步 ≥19s ≈ 360s，
      #      必然顶到 step 超时被 kill。实测：03:12:41 起 → 03:17:46 等满 300s
      #      → 03:18:22 写完用户 hive → 03:18:41 被杀，正好 360s。
      #   ② 「超时转后台」根本没生效：GitHub Actions 结束/超时一个 step 时会杀掉该 step
      #      的**整棵进程树**，老版 Start-Process 起的那个「后台」子进程跟 step 同树，
      #      于是一起被 kill —— 语言包**从来没装成功过**（日志里只有 TIMEOUT_BACKGROUND，
      #      从没出现「语言包安装结束」）。而且 CHINESE_STATUS 写在脚本最末尾，
      #      被 kill 后一个状态都没透出 → ENV READY 里「中文环境」整行消失。
      #
      # 现在的设计（脚本内改动，见 scripts/setup-chinese.ps1 头部说明）：
      #   · 语言包安装改挂**计划任务**（Task Scheduler 服务拉起，不在本 step 进程树里，
      #     活得过 step 超时），主脚本只负责挂任务 + 写注册表，秒级返回；
      #   · 状态**分段落盘**（GITHUB_ENV + _state\chinese-status.json），
      #     任何时刻被 kill 都留得下一份自洽状态；
      #   · 「同步等语言包」挪到最后、默认只等 90s —— 唯一不可控时长的那段放最后。
      # 这里给到 8 分钟是纯保险：脚本正常 100~150s 就返回。
      #
      # 用户级语言键这里先写一遍；第 8 步「预还原」会导入 HKCU-Software.reg 把它覆盖掉，
      # 所以第 8b 步还要再补写一次（幂等、秒级）。
      - name: 0f. 设置中文 + 微软拼音输入法（秒级放行，语言包转计划任务后台）
        timeout-minutes: 8            # 保险：脚本正常 100~150s 返回，这里只是防卡死
        continue-on-error: true       # 万一被超时杀掉也不阻断后续步骤
        shell: pwsh
        run: .\scripts\setup-chinese.ps1
      - name: 1. 开机瘦身（删镜像自带大件，约 70 GB）
        shell: pwsh
        run: .\scripts\slim-image.ps1
      - name: 2. C 盘守卫：记录基线（在瘦身之后）
        shell: pwsh
        run: .\scripts\disk-guard.ps1 -Baseline
      - name: 3. 生成 AList 管理员密码（本机专用）
        shell: pwsh
        run: |
          $chars = (48..57) + (65..90) + (97..122)
          $pass = -join ($chars | Get-Random -Count 24 | ForEach-Object { [char]$_ })
          "ALIST_ADMIN_PASS=$pass" | Out-File $env:GITHUB_ENV -Append -Encoding ascii
      - name: 4. 安装并配置 rclone
        shell: pwsh
        run: .\scripts\setup-rclone.ps1
      - name: 5. 部署 AList 并挂载 139 云盘
        shell: pwsh
        env:
          ALIST_139_AUTHORIZATION: ${{ secrets.ALIST_139_AUTHORIZATION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\setup-alist.ps1
      - name: 6. （可选）迁移 139 老路径到 AI文件库
        shell: pwsh
        run: .\scripts\migrate-139.ps1
      - name: 7. 从 139 云盘拉取数据
        # 脚本自身永不返回非 0；这一层是「万一抛异常」的兜底 —— 开机不能被拉数据卡死，
        # 状态由 _state\restore-status.json 记录，保活循环会自愈重拉。
        continue-on-error: true
        shell: pwsh
        run: .\scripts\sync-down.ps1
      - name: 8. 预还原（校验 → 规划 → 准备 → 驱动全量还原）
        continue-on-error: true
        shell: pwsh
        run: .\scripts\pre-restore.ps1 -Pull
      # 预还原会导入 registry\user\HKCU-Software.reg（整棵 HKCU\Software），
      # 把 0f 步写的用户级语言/输入法键覆盖掉 —— 所以这里必须再补写一次（幂等、秒级）。
      - name: 8b. 补写用户语言键（预还原会覆盖，需再写一次）
        continue-on-error: true
        shell: pwsh
        run: .\scripts\setup-chinese.ps1 -UserHiveOnly
      - name: 10. 后台重装软件 + 恢复 Edge/WorkBuddy 用户数据（异步，不阻塞连接）
        shell: pwsh
        run: .\scripts\reinstall-apps.ps1 -Background
      - name: 11. C 盘守卫：清理超限增量 + 报告
        shell: pwsh
        run: .\scripts\disk-guard.ps1 -Enforce
      - name: 12. 估算额度（仅手动触发；定时场跳过）
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
        run: .\scripts\quota-report.ps1
      # 中文语言包是 0f 步挂到计划任务里后台装的（约 30~43 分钟），到这一步可能刚好装完。
      # 这里补核对一次：装完了就把 CHINESE_STATUS/CHINESE_LANGPACK 刷成真实结果，
      # 让下面 ENV READY 显示的是实话（幂等、秒级；没装完就照实写「后台安装中」）。
      - name: 12b. 中文语言包收尾核对（后台装完则补报）
        continue-on-error: true
        shell: pwsh
        run: .\scripts\setup-chinese.ps1 -CheckOnly
      - name: 13. 环境就绪汇总（ENV READY）
        shell: pwsh
        run: |
          # 就绪耗时：从 job 起点 / 从拿到 IP 各算一次
          $sysDir    = $env:CLOUDRDP_SYS_DIR
          $startFile = Join-Path $sysDir '_state\job-start.txt'
          $readyFile = Join-Path $sysDir '_state\rdp-ready-at.txt'
          $totalMin  = '?'
          $afterIpMin = '?'
          try {
            $nowU = (Get-Date).ToUniversalTime()
            if (Test-Path -LiteralPath $startFile) {
              $st = [datetime]::Parse((Get-Content -LiteralPath $startFile -Raw).Trim()).ToUniversalTime()
              $totalMin = [math]::Round(($nowU - $st).TotalMinutes, 1)
            }
            if (Test-Path -LiteralPath $readyFile) {
              $rdy = [datetime]::Parse((Get-Content -LiteralPath $readyFile -Raw).Trim()).ToUniversalTime()
              $afterIpMin = [math]::Round(($nowU - $rdy).TotalMinutes, 1)
            }
          } catch { }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> ENV READY —— 环境初始化完成 <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $env:TS_IP" -ForegroundColor Yellow
          Write-Host "  Username     : $env:RDP_USER" -ForegroundColor Yellow
          Write-Host "  Password     : $env:RDP_PASSWORD" -ForegroundColor Yellow
          Write-Host "  开机总耗时   : $totalMin 分钟（其中拿到 IP 后 $afterIpMin 分钟用于初始化）" -ForegroundColor DarkGray
          # ---- 数据/快照恢复状态：优先读 _state\restore-status.json（带 reason），env 作兜底 ----
          $dataSt = [string]$env:RESTORE_STATUS
          $dataRs = [string]$env:RESTORE_REASON
          $snapSt = [string]$env:SNAPSHOT_STATUS
          $snapRs = ''
          try {
            $stFile = Join-Path $sysDir '_state\restore-status.json'
            if (Test-Path -LiteralPath $stFile) {
              $o = (Get-Content -LiteralPath $stFile -Raw | ConvertFrom-Json)
              if ($o.data)     { if ($o.data.status)     { $dataSt = [string]$o.data.status }
                                 if ($o.data.reason)     { $dataRs = [string]$o.data.reason } }
              if ($o.snapshot) { if ($o.snapshot.status) { $snapSt = [string]$o.snapshot.status }
                                 if ($o.snapshot.reason) { $snapRs = [string]$o.snapshot.reason } }
            }
          } catch { }

          $dataDir = $env:CLOUDRDP_DATA_DIR
          if ([string]::IsNullOrWhiteSpace($dataSt)) { $dataSt = "UNKNOWN" }
          $rc = switch ($dataSt) {
            "OK"        { "Green" }
            "EMPTY"     { "DarkGray" }
            "TRANSIENT" { "Yellow" }
            "PENDING"   { "Yellow" }
            "UNKNOWN"   { "DarkGray" }
            default     { "Red" }
          }
          $dataNote = switch ($dataSt) {
            "OK"        { "（$dataDir 已与 139 云盘同步）" }
            "EMPTY"     { "（139 上还没有数据 —— 首次运行正常）" }
            "TRANSIENT" { "（139 暂时不可达，本次未拉取；保活循环会自动重试）" }
            "PENDING"   { "（恢复中；保活循环会自动重试）" }
            "UNKNOWN"   { "（未取得恢复状态）" }
            default     { "（恢复失败：$dataDir 当前为空）" }
          }
          Write-Host "  数据恢复     : $dataSt   $dataNote" -ForegroundColor $rc
          if (-not [string]::IsNullOrWhiteSpace($dataRs)) {
            Write-Host "                 原因：$dataRs" -ForegroundColor DarkGray
          }
          if ($dataSt -ne "OK" -and $dataSt -ne "EMPTY" -and $dataSt -ne "UNKNOWN") {
            Write-Host "  !! 别在 $dataDir 上存重要东西：恢复没成功，本地是空壳；保活循环每 10 分钟会自动重试 !!" -ForegroundColor Red
          }

          if ([string]::IsNullOrWhiteSpace($snapSt)) { $snapSt = "UNKNOWN" }
          $sc = switch ($snapSt) {
            "OK"        { "Green" }
            "PARTIAL"   { "Yellow" }
            "EMPTY"     { "DarkGray" }
            "SKIPPED"   { "DarkGray" }
            "TRANSIENT" { "Yellow" }
            "PENDING"   { "Yellow" }
            "UNKNOWN"   { "DarkGray" }
            default     { "Red" }
          }
          $rd = $env:SNAPSHOT_RESTORED_DIRS
          if ([string]::IsNullOrWhiteSpace($rd)) { $rdTxt = "个人配置在首次登录时自动还原" }
          else { $rdTxt = "$rd 个目录已还原；个人配置在首次登录时自动还原" }
          Write-Host "  整机还原     : $snapSt   ($rdTxt)" -ForegroundColor $sc
          if (-not [string]::IsNullOrWhiteSpace($snapRs)) {
            Write-Host "                 原因：$snapRs" -ForegroundColor DarkGray
          }
          if ($snapSt -eq "EMPTY") {
            Write-Host "  (139 上还没有整机快照 —— 首次运行正常，本次关机前会自动生成第一份)" -ForegroundColor DarkGray
          }
          if ($snapSt -eq "TRANSIENT" -or $snapSt -eq "PENDING") {
            Write-Host "  !! 整机快照本次没还原：本次是全新环境，保活循环会自动重试（快照未成功前不会推送，避免覆盖 139 上的好快照）!!" -ForegroundColor Yellow
          }
          if ($snapSt -eq "FAILED") {
            Write-Host "  !! 整机还原失败：本次是全新环境，之前装的软件/设置不会自动回来 !!" -ForegroundColor Red
          }
          $pgN = $env:SNAPSHOT_PROGRAMS
          if (-not [string]::IsNullOrWhiteSpace($pgN) -and $pgN -ne "0") {
            Write-Host "  安装型程序   : 上次快照含 $pgN 个（实体落 D 盘，原安装路径用 junction 指过来）" -ForegroundColor DarkGray
          }
          # ---- 中文语言包（0f 步；超时转后台）----
          $lp = $env:LANGPACK
          if (-not [string]::IsNullOrWhiteSpace($lp)) {
            $lpc = "DarkGray"
            if ($lp -eq "OK" -or $lp -eq "PRESENT" -or $lp -eq "OK-CAPABILITY") { $lpc = "Green" }
            elseif ($lp -eq "TIMEOUT_BACKGROUND") { $lpc = "Yellow" }
            elseif ($lp -eq "FAILED") { $lpc = "Red" }
            $lpNote = ""
            if ($lp -eq "TIMEOUT_BACKGROUND") { $lpNote = "（已转后台继续装，装完重新登录即生效）" }
            Write-Host "  中文语言包   : $lp$lpNote" -ForegroundColor $lpc
          }
          # ---- 还原取证：用户最在意的两块数据 ----
          $er = $env:EDGE_RESTORE
          if (-not [string]::IsNullOrWhiteSpace($er)) {
            $erc = if ($er -eq "OK") { "Green" } elseif ($er -eq "MISSING") { "Yellow" } else { "DarkGray" }
            Write-Host "  Edge 数据    : $er   (配置/历史/收藏夹；cookie/密码跨机解不开，靠账号同步)" -ForegroundColor $erc
          }
          $wr = $env:WBAI_RESTORE
          if (-not [string]::IsNullOrWhiteSpace($wr)) {
            $wrc = if ($wr -eq "OK") { "Green" } elseif ($wr -eq "MISSING") { "Yellow" } else { "DarkGray" }
            Write-Host "  .workbuddy-ai: $wr   (对话记录/会话数据库)" -ForegroundColor $wrc
          }
          $scP = $env:SHORTCUTS_PARKED
          if (-not [string]::IsNullOrWhiteSpace($scP) -and $scP -ne "0") {
            Write-Host "  失效快捷方式 : $scP 个已移入「_失效快捷方式」（目标程序没能还原）" -ForegroundColor Yellow
          }
          $scD = $env:SHORTCUTS_PARKDEFER
          if (-not [string]::IsNullOrWhiteSpace($scD) -and $scD -ne "0") {
            Write-Host "  快捷方式暂缓 : $scD 个死链暂不移入（程序清单为空或后台重装未结束，留在桌面等下一轮）" -ForegroundColor DarkGray
          }
          # ---- 邮箱投递结果 ----
          $mr = $env:MAIL_RESULT
          if (-not [string]::IsNullOrWhiteSpace($mr)) {
            $mrc = "DarkGray"
            if ($mr -eq "OK") { $mrc = "Green" } elseif ($mr -like "FAIL*") { $mrc = "Red" }
            Write-Host "  连接信息邮件 : $mr   (诊断日志 $sysDir\_state\mail.log)" -ForegroundColor $mrc
          }
          Write-Host "  快照一致性   : $env:SNAP_QUIESCE  (全量快照前关闭占用程序，保证 SQLite/LevelDB 落盘一致)" -ForegroundColor DarkGray
          $scC = $env:SNAPSHOT_SHORTCUTS_CAPTURED
          if (-not [string]::IsNullOrWhiteSpace($scC) -and $scC -ne "0") {
            $scM = $env:SNAPSHOT_SHORTCUTS_MB
            $scS = $env:SNAPSHOT_SHORTCUTS_SKIPPED
            $scExtra = ""
            if (-not [string]::IsNullOrWhiteSpace($scS) -and $scS -ne "0") { $scExtra = "  [超限/无法推断跳过 $scS 个]" }
            Write-Host "  快捷方式补抓 : 上次快照含 $scC 个补抓程序（$scM MB）$scExtra" -ForegroundColor DarkGray
          }
          $scK = $env:SNAPSHOT_SC_CHECKED
          if (-not [string]::IsNullOrWhiteSpace($scK)) {
            $scR = $env:SNAPSHOT_SC_REPAIRED
            $scP = $env:SNAPSHOT_SC_PARKED
            Write-Host "  快捷方式校验 : 公共桌面 检查 $scK / 修复 $scR / 移入失效 $scP   (个人桌面登录时校验)" -ForegroundColor DarkGray
          }
          $dg = $env:DISK_GUARD_STATUS
          if (-not [string]::IsNullOrWhiteSpace($dg)) {
            $dc = "DarkGray"
            if ($dg -eq "OK" -or $dg -eq "FIXED") { $dc = "Green" } elseif ($dg -eq "OVER") { $dc = "Red" }
            Write-Host "  C 盘占用     : $($env:DISK_C_USED_PCT)%  ($($env:DISK_C_USED_GB) / $($env:DISK_C_TOTAL_GB) GB)   本次增量 $($env:DISK_C_DELTA_MB) MB / 上限 $($env:DISK_C_LIMIT_MB) MB" -ForegroundColor $dc
            Write-Host "  D 盘可用     : $($env:DISK_D_FREE_GB) GB  (数据 / 快照 / 程序实体都在 D 盘)" -ForegroundColor DarkGray
            if ($dg -eq "OVER") {
              Write-Host "  !! C 盘增量超限：大文件请放 D 盘；新装程序尽量装到 D 盘 !!" -ForegroundColor Red
            }
          }
          $sl = $env:SLIM_STATUS
          if (-not [string]::IsNullOrWhiteSpace($sl)) {
            $slc = "DarkGray"
            if ($sl -eq "OK") { $slc = "Green" } elseif ($sl -eq "PARTIAL") { $slc = "Yellow" }
            Write-Host "  开机瘦身     : $sl   释放 $($env:SLIM_FREED_GB) GB（删除 $($env:SLIM_TARGETS_DELETED) 项镜像大件，保护 $($env:SLIM_TARGETS_GUARDED) 项）" -ForegroundColor $slc
            if ($sl -eq "PARTIAL") {
              Write-Host "  (瘦身后仍高于目标 —— 把大件路径加到 snapshot-config.json 的 slim.targets)" -ForegroundColor DarkGray
            }
          }
          $ch = $env:CHINESE_STATUS
          if (-not [string]::IsNullOrWhiteSpace($ch)) {
            $chc = "DarkGray"
            if ($ch -eq "OK") { $chc = "Green" } elseif ($ch -eq "PARTIAL") { $chc = "Yellow" } elseif ($ch -eq "FAILED") { $chc = "Red" }
            Write-Host "  中文环境     : $ch   (语言包 $($env:CHINESE_LANGPACK) / 系统 $($env:CHINESE_SYSTEMLOCALE) / 用户 $($env:CHINESE_USERHIVE))" -ForegroundColor $chc
            if ($ch -eq "PARTIAL" -or $ch -eq "FAILED") {
              Write-Host "  (中文未完全生效：语言包由 Windows Update 下载，日志 $sysDir\_state\langpack.log；" -ForegroundColor DarkGray
              Write-Host "   注册表部分（用户语言键/微软拼音）已写好，语言包装完新开一个会话即生效)" -ForegroundColor DarkGray
            }
          }
          $up = $env:SNAPSHOT_USER_PRERESTORE
          if (-not [string]::IsNullOrWhiteSpace($up)) {
            $upc = "DarkGray"
            if ($up -eq "OK") { $upc = "Green" } elseif ($up -eq "SKIPPED") { $upc = "Yellow" }
            Write-Host "  开机预还原   : $up   (个人桌面/文档/HKCU 在开机阶段就放好，不等首次登录)" -ForegroundColor $upc
          }
          $pv = $env:SNAPSHOT_PREVALIDATE
          if (-not [string]::IsNullOrWhiteSpace($pv)) {
            Write-Host "  预还原校验   : $pv" -ForegroundColor DarkGray
          }
          $ap = $env:APPS_REINSTALL_STATE
          if (-not [string]::IsNullOrWhiteSpace($ap)) {
            Write-Host "  软件重装     : $ap" -ForegroundColor DarkGray
            Write-Host "                 日志: C:\_snapshot\_logs\apps-reinstall.log" -ForegroundColor DarkGray
          }
          $ud = $env:USERDATA_RESTORE
          if (-not [string]::IsNullOrWhiteSpace($ud)) {
            $udc = "DarkGray"
            if ($ud -eq "OK") { $udc = "Green" } elseif ($ud -eq "PARTIAL") { $udc = "Yellow" } elseif ($ud -eq "MISSING") { $udc = "Red" }
            $udTxt = switch ($ud) {
              "OK"      { "已完整恢复" }
              "PARTIAL" { "部分恢复（有目标缺失，见详情）" }
              "MISSING" { "未恢复（请检查快照是否包含用户数据）" }
              default   { $ud }
            }
            Write-Host "  用户数据     : $ud  $udTxt" -ForegroundColor $udc
            if (-not [string]::IsNullOrWhiteSpace($env:USERDATA_RESTORE_DETAIL)) {
              Write-Host "                 $($env:USERDATA_RESTORE_DETAIL)" -ForegroundColor DarkGray
            }
            Write-Host "                 Edge=$($env:EDGE_RESTORE)  WorkBuddy=$($env:WBAI_RESTORE)   (浏览记录/已存密码/下载位置/用户数据/缓存/安装目录)" -ForegroundColor DarkGray
          }
          # Edge 加密密钥（DPAPI）能力：文件「在不在」看不出「解不解得开」。
          # 密码 / Cookie 是 DPAPI 加密的、密钥绑旧机器+旧用户 → 跨机必然 BROKEN。
          # 这里把结论和「怎么恢复登录态」直接写进汇总，不让用户自己去猜。
          $ec = $env:EDGE_CRYPT
          if (-not [string]::IsNullOrWhiteSpace($ec) -and $ec -ne "UNKNOWN") {
            if ($ec -eq "BROKEN") {
              Write-Host "  Edge 登录态  : BROKEN  ⚠ 已保存的密码 / Cookie 跨机解不开（Windows DPAPI 绑旧机器+旧用户）" -ForegroundColor Yellow
              Write-Host "                 已恢复：历史 / 收藏夹 / 偏好 / 自动填充 / 站点本地存储(Local Storage、IndexedDB、Service Worker)" -ForegroundColor DarkGray
              Write-Host "                 恢复登录态：Edge 里登录 Microsoft 或 Google 账号并开启「同步」（设置 → 个人资料 → 同步）" -ForegroundColor DarkGray
            } else {
              Write-Host "  Edge 登录态  : $ec（加密密钥可解）" -ForegroundColor Green
            }
          }
          $qp = $env:QUOTA_LEFT_PCT
          if (-not [string]::IsNullOrWhiteSpace($qp)) {
            $qi = [int]$qp
            $qc = "DarkGray"
            if ($qi -le 20) { $qc = "Red" } elseif ($qi -le 50) { $qc = "Yellow" }
            $src = $env:QUOTA_SOURCE
            if ($src -eq "billing-api") { $src = "官方API" }
            elseif ($src -eq "run-history") { $src = "本仓库估算" }
            Write-Host "  Actions 额度 : 剩余 $qi%  (≈$($env:QUOTA_LEFT_MIN) 分钟 / $src)" -ForegroundColor $qc
            if ($qi -le 20) {
              Write-Host "  !! 额度告急：只剩 $($env:QUOTA_LEFT_MIN) 分钟，定时任务随时静默停摆，次月 1 号才重置 !!" -ForegroundColor Red
            }
          }
          $utr = $env:SNAPSHOT_USER_TASK_RUN
          if (-not [string]::IsNullOrWhiteSpace($utr)) {
            $utrTxt = switch ($utr) {
              "TRIGGERED"   { "已立即触发（你已登录，不等下次登录）" }
              "WAIT_LOGON"  { "等你首次登录时执行" }
              "FAILED"      { "触发失败 —— 个人配置可能不完整" }
              default       { $utr }
            }
            $utrColor = "DarkGray"
            if ($utr -eq "FAILED") { $utrColor = "Yellow" }
            Write-Host "  用户级还原   : $utrTxt" -ForegroundColor $utrColor
          }
          Write-Host "  >> 打开 mstsc，连接上面的 Tailscale IP" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

          # 桌面标记文件：初始化中 -> 就绪
          try {
            $upMarker   = Join-Path $env:PUBLIC 'Desktop\_CloudRDP_SETTING_UP.txt'
            $readyMark  = Join-Path $env:PUBLIC 'Desktop\_CloudRDP_READY.txt'
            @(
              "环境初始化完成（ENV READY）"
              ""
              "Tailscale IP : $env:TS_IP"
              "Username     : $env:RDP_USER"
              "Password     : $env:RDP_PASSWORD"
              "开机总耗时   : $totalMin 分钟"
              ""
              "数据恢复     : $dataSt"
              "整机还原     : $snapSt"
              "中文环境     : $env:CHINESE_STATUS"
            ) | Out-File -LiteralPath $readyMark -Encoding UTF8
            if (Test-Path -LiteralPath $upMarker) { Remove-Item -LiteralPath $upMarker -Force -ErrorAction SilentlyContinue }
          } catch { Write-Host "更新桌面标记文件失败: $_" }
      - name: 14. 保活（跑到 job 硬上限；收尾在最后 15 分钟后台跑，不中断远程连接）
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RELAY_TOKEN: ${{ secrets.GH_RELAY_TOKEN }}
        run: |
          $now = (Get-Date).ToUniversalTime()
          $kaStart = $now

          # ---------- 硬上限：GitHub-hosted runner 单 job = 6 小时（360 分钟），平台限制无法突破 ----------
          # 所以「48 小时」只能靠接力：本轮跑满 → relay-next.ps1 触发下一个 run → 新机器从 139 快照恢复。
          $JOB_LIMIT_MIN = 360
          $HARD_MARGIN   = 8      # 给第 15 步与 post 步骤留余量，避免卡着 360 被强杀
          $TAIL_RESERVE  = 15     # 收尾在这段时间里【后台】跑 —— 不占可用窗口、不中断 RDP

          $jsf = Join-Path $env:CLOUDRDP_SYS_DIR '_state\job-start.txt'
          $jobStart = $null
          if (Test-Path -LiteralPath $jsf) {
              try { $jobStart = [datetime]::Parse((Get-Content -LiteralPath $jsf -Raw).Trim()).ToUniversalTime() } catch { }
          }
          if (-not $jobStart) { $jobStart = $now }

          $hardStop     = $jobStart.AddMinutes($JOB_LIMIT_MIN - $HARD_MARGIN)
          $usedMin      = [int][math]::Floor(($now - $jobStart).TotalMinutes)
          $maxKeepalive = [int][math]::Floor(($hardStop - $now).TotalMinutes)
          if ($maxKeepalive -lt 0) { $maxKeepalive = 0 }
          Write-Host "[keepalive] job 已用 $usedMin 分钟（含 setup），硬上限 $JOB_LIMIT_MIN 分钟 → 本次最多保活 $maxKeepalive 分钟"

          if ($env:IS_MANUAL -eq "true") {
              $mins = 350
              if (-not [string]::IsNullOrWhiteSpace($env:INPUT_DURATION)) {
                  $parsed = 0
                  if ([int]::TryParse($env:INPUT_DURATION, [ref]$parsed) -and $parsed -gt 0) { $mins = $parsed }
              }
              if ($mins -gt $maxKeepalive) {
                  Write-Host "[keepalive] 请求 $mins 分钟 > 上限 $maxKeepalive 分钟 → 收敛（否则被 6 小时上限强杀，收尾快照丢失）"
                  $mins = $maxKeepalive
              }
              $stop = $now.AddMinutes($mins)
              Write-Host "[keepalive] 手动触发：保活 $mins 分钟，预计 $($stop.ToString('HH:mm')) UTC 结束"
          } else {
              # 定时场：不再按下班点提前收工，直接跑满到 job 硬上限。
              # 旧逻辑是「早场跑到 11:30 北京、午场跑到 17:30 北京，过了 17:30 只保活 60 分钟」，
              # 但 cron 触发本身常被 GitHub 延迟 4~5 小时，保活开始时往往已过下班点，
              # 结果只跑 60 分钟就关机，白白浪费 6 小时额度（实测 run 35435378079 只 2.5h）。
              # 现在统一跑满 maxKeepalive（= hardStop - now，到硬上限前留 8 分钟收尾）。
              $stop = $now.AddMinutes($maxKeepalive)
              Write-Host "[keepalive] 定时触发：跑满 $maxKeepalive 分钟（到硬上限），预计 $($stop.ToString('HH:mm')) UTC 自动停止"
          }

          # 收尾在「保活结束前 TAIL_RESERVE 分钟」后台启动：
          # 主循环继续 sleep → 远程连接全程可用 → 收尾在后台并行完成。
          $tailAt = $stop.AddMinutes(-$TAIL_RESERVE)
          Write-Host "[keepalive] 收尾将于 $($tailAt.ToString('HH:mm')) UTC 在后台启动（远程连接不中断）"

          # ---------- 池角色：primary 独占写 139；standby 只读热备 ----------
          $poolMode = ($env:POOL_MODE -eq 'pool')
          $poolHub  = [string]$env:POOL_HUB
          $roleFile = Join-Path $env:CLOUDRDP_SYS_DIR '_state\pool-role.txt'
          $myOwner  = [string]$env:POOL_OWNER
          if ([string]::IsNullOrWhiteSpace($myOwner)) { $myOwner = [string]$env:GITHUB_REPOSITORY_OWNER }

          function Get-CurrentRole {
              try {
                  if (Test-Path -LiteralPath $roleFile) {
                      $r = (Get-Content -LiteralPath $roleFile -Raw).Trim().ToLowerInvariant()
                      if ($r) { return $r }
                  }
              } catch { }
              return 'standalone'
          }

          $role     = if ($poolMode) { Get-CurrentRole } else { 'standalone' }
          $isWriter = ($role -ne 'standby')   # primary / standalone 都写 139
          $rolePoll = 5                       # 每 5 分钟核对一次权威角色

          if ($poolMode) {
              . .\scripts\pool-lib.ps1
              Write-Host "[pool] 池模式：owner=$myOwner  初始角色=$role  hub=$poolHub"
              if ($role -eq 'standby') {
                  Write-Host "[pool] 备机：不写 139，每 10 分钟重拉保持热备；权威状态指向本机即自升为主"
              } else {
                  Write-Host "[pool] 主机：独占写 139（用户数据 + 整机快照）"
              }
          }

          $n = 0
          $finalizeStarted = $false
          while ((Get-Date).ToUniversalTime() -lt $stop) {
              Start-Sleep -Seconds 60
              $n++
              $t    = (Get-Date).ToUniversalTime()
              $left = [int](($stop - $t).TotalMinutes)
              Write-Host "[$n] server running... 剩余 $left 分钟  (role=$role)"

              if ($n % 10 -eq 0) {
                  # ---------- 自愈：数据/快照没恢复成功就重拉（acc-1 事故的兜底）----------
                  # 事故回顾：开机时 139 的 DNS 抖了几秒 → 旧逻辑把 rclone 退出码 3 误判成 EMPTY
                  # → 整机 6 小时一个文件都没拉回来。现在只要状态不是 OK/EMPTY，每 10 分钟再试一次，
                  # 网络一恢复就自动补齐，不需要人工干预。
                  $rsFile = Join-Path $env:CLOUDRDP_SYS_DIR '_state\restore-status.json'
                  $dataSt = ''
                  try {
                      if (Test-Path -LiteralPath $rsFile) {
                          $o = (Get-Content -LiteralPath $rsFile -Raw | ConvertFrom-Json)
                          if ($o.data) { $dataSt = [string]$o.data.status }
                      }
                  } catch { }

                  if ($dataSt -in @('TRANSIENT', 'FAILED', 'PENDING')) {
                      Write-Host "[self-heal] 数据恢复状态=$dataSt → 重拉（sync-down -Repull）"
                      & .\scripts\sync-down.ps1 -Repull
                      try {
                          $o2 = (Get-Content -LiteralPath $rsFile -Raw | ConvertFrom-Json)
                          if ($o2.data) { $dataSt = [string]$o2.data.status }
                          Write-Host "[self-heal] 重拉后数据恢复状态=$dataSt"
                      } catch { }
                  }

                  # ---------- 中文语言包：后台装完就补记（0f 挂的计划任务）----------
                  # 语言包要 30~43 分钟，常晚于 step 12b 那次核对；保活循环要跑几小时，
                  # 这里每 10 分钟补查一次，装完就把 chinese-status.json 刷成真实结果。
                  $csJson = Join-Path $env:CLOUDRDP_SYS_DIR '_state\chinese-status.json'
                  $csLp = ''
                  try {
                      if (Test-Path -LiteralPath $csJson) {
                          $co = (Get-Content -LiteralPath $csJson -Raw | ConvertFrom-Json)
                          $csLp = [string]$co.langpack
                      }
                  } catch { }
                  if ($csLp -in @('PENDING', 'TIMEOUT_BACKGROUND')) {
                      & .\scripts\setup-chinese.ps1 -CheckOnly
                  }

                  $snapPend = Join-Path $env:CLOUDRDP_SYS_DIR '_state\snapshot-restore-pending.txt'
                  if (Test-Path -LiteralPath $snapPend) {
                      # 前台跑：天然串行、不会叠多个并发还原；成功时 pre-restore 会自己删掉这个标记
                      Write-Host "[self-heal] 检测到快照待重试标记 → 重跑预还原（pre-restore -Pull）"
                      & .\scripts\pre-restore.ps1 -Pull
                  }

                  # 常规：主推用户数据 / 备重拉保持与主一致
                  if ($isWriter) { & .\scripts\sync-up.ps1 }
                  else           { & .\scripts\sync-down.ps1 }
              }
              if ($n % 30 -eq 0) { & .\scripts\disk-guard.ps1 -Enforce }  # 每 30 分钟：C 盘守卫
              if ($n % 60 -eq 0) {
                  if ($isWriter) { & .\scripts\backup-snapshot.ps1 -Quick -Push }   # 主：快速快照 + 推送
                  else           { & .\scripts\backup-snapshot.ps1 -Quick }         # 备：本地完整快照，不碰 139
              }

              # ---------- 一键备份请求（工作台「快照栏 → 一键备份」按钮下发）----------
              # 工作台没有命令通道，改走文件：它经 SMB 写 _state\backup-request.txt，
              # 这里每分钟取走（取走即删 —— 工作台靠「文件在不在」判断请求是否还在排队），
              # 随即执行一次「同步用户数据到 139 + 快速快照推送」，最后写 backup-done.txt 留痕。
              $bkReq = Join-Path $env:CLOUDRDP_SYS_DIR '_state\backup-request.txt'
              if (Test-Path -LiteralPath $bkReq) {
                  try {
                      $bkRaw = (Get-Content -LiteralPath $bkReq -Raw)
                      Remove-Item -LiteralPath $bkReq -Force -ErrorAction SilentlyContinue
                      $bkBy = 'workbench'
                      $mb = [regex]::Match($bkRaw, '(?m)^requested_by=(.+)$')
                      if ($mb.Success -and -not [string]::IsNullOrWhiteSpace($mb.Groups[1].Value)) {
                          $bkBy = $mb.Groups[1].Value.Trim()
                      }
                      Write-Host "[backup] 收到一键备份请求（by $bkBy）→ 执行 同步 + 快速快照"
                      if ($isWriter) {
                          & .\scripts\sync-up.ps1
                          & .\scripts\backup-snapshot.ps1 -Quick -Push
                      } else {
                          Write-Host "[backup] 备机：只做本地快速快照，不写 139"
                          & .\scripts\backup-snapshot.ps1 -Quick
                      }
                      @(
                        "handled_at=$((Get-Date).ToUniversalTime().ToString('o'))"
                        "requested_by=$bkBy"
                        "role=$role"
                        "status=OK"
                      ) | Out-File -LiteralPath (Join-Path $env:CLOUDRDP_SYS_DIR '_state\backup-done.txt') -Encoding ascii
                      Write-Host "[backup] 一键备份完成"
                  } catch {
                      Write-Host "[backup] 处理一键备份请求失败：$($_.Exception.Message)"
                  }
              }

              # ---------- 池角色核对：standby 读 hub 权威状态，主下线则自升为主 ----------
              # 权威状态由 hub 协调器每 10 分钟发布（primary = 最老的在跑机）。
              # 只「升主」不「降级」：协调器任一时刻只指定一个 primary，故不存在双主；
              # 不做降级可避免状态抖动时主备反复横跳。
              if ($poolMode -and ($n % $rolePoll -eq 0)) {
                  try {
                      $parts = $poolHub.Split('/')
                      $st = $null
                      if ($parts.Count -ge 2) {
                          $st = Get-PoolState -HubOwner $parts[0] -HubRepo $parts[1] `
                                -StateBranch $env:POOL_STATE_BRANCH -StatePath $env:POOL_STATE_PATH
                      }
                      if ($st) {
                          $primOwner = ''
                          if ($st.primary) { $primOwner = [string]$st.primary.owner }
                          $mine = (-not [string]::IsNullOrWhiteSpace($myOwner)) -and ($primOwner -ieq $myOwner)
                          if ($role -eq 'standby' -and ($mine -or [string]::IsNullOrWhiteSpace($primOwner))) {
                              $why = if ($mine) { '权威状态已指向本机' } else { '权威状态无 primary（主已下线）' }
                              Write-Host "[pool] $why → 自升为主，立即补齐备份（数据 + 快速快照）"
                              $role = 'primary'; $isWriter = $true
                              $role | Out-File -LiteralPath $roleFile -Encoding ascii
                              & .\scripts\sync-up.ps1
                              & .\scripts\backup-snapshot.ps1 -Quick -Push
                          } else {
                              Write-Host "[pool] 角色核对：权威 primary=$(if ($primOwner) { $primOwner } else { '(空)' })  本机=$role（保持不变）"
                          }
                      } else {
                          Write-Host "[pool] 角色核对：读不到 hub 状态（保持 $role）"
                      }
                  } catch { Write-Host "[pool] 角色核对失败（忽略，保持 $role）：$($_.Exception.Message)" }
              }

              if (-not $finalizeStarted -and $t -ge $tailAt) {
                  Write-Host "[keepalive] 到点：后台启动收尾（role=$role）"
                  & .\scripts\finalize-background.ps1 -Background -Role $role
                  $finalizeStarted = $true
              }
          }
          # 兜底：保活时长被压到小于 TAIL_RESERVE 时循环里没触发过，这里补一次
          if (-not $finalizeStarted) {
              Write-Host "[keepalive] 补启动后台收尾（role=$role）"
              & .\scripts\finalize-background.ps1 -Background -Role $role
              $finalizeStarted = $true
          }
          Write-Host "[keepalive] 保活窗口结束"

          # ---------- 接力：凑够 relay_minutes（单 job 只 6 小时，48 小时必须接力）----------
          $relayTotal = 0
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_RELAY_MINUTES)) {
              $p = 0
              if ([int]::TryParse($env:INPUT_RELAY_MINUTES, [ref]$p) -and $p -gt 0) { $relayTotal = $p }
          }
          if ($relayTotal -gt 0) {
              $elapsed = [int][math]::Floor(((Get-Date).ToUniversalTime() - $kaStart).TotalMinutes)
              & .\scripts\relay-next.ps1 -TotalMinutes $relayTotal -ElapsedMinutes $elapsed
          } else {
              Write-Host "[keepalive] 未要求接力（relay_minutes=0），本轮结束后机器销毁"
          }
      - name: 15. 等待后台收尾（兜底：未启动则前台补跑）
        if: always()
        shell: pwsh
        run: |
          # 收尾已在第 14 步末尾【后台】启动，这里只等它跑完 —— 正常情况下flag 早就存在，直接返回。
          $logDir   = Join-Path $env:CLOUDRDP_SYS_DIR '_logs'
          $flag     = Join-Path $logDir 'finalize-done.flag'
          $status   = Join-Path $logDir 'finalize-status.json'
          $deadline = (Get-Date).ToUniversalTime().AddMinutes(4)

          while (-not (Test-Path -LiteralPath $flag) -and ((Get-Date).ToUniversalTime() -lt $deadline)) {
              Start-Sleep -Seconds 10
          }

          if (Test-Path -LiteralPath $flag) {
              if (Test-Path -LiteralPath $status) {
                  try {
                      $s = (Get-Content -LiteralPath $status -Raw) | ConvertFrom-Json
                      Write-Host "[finalize] 后台收尾完成：state=$($s.state)  error=$($s.error)"
                  } catch { Write-Host "[finalize] 后台收尾完成（状态文件解析失败）" }
              } else {
                  Write-Host "[finalize] 后台收尾完成"
              }
          } else {
              Write-Host "[finalize] 后台收尾超时或未启动 → 前台补跑一次"
              # 角色决定是否写 139：备机只做本地完整快照，避免与主双写
              $rf = Join-Path $env:CLOUDRDP_SYS_DIR '_state\pool-role.txt'
              $role = 'standalone'
              if (Test-Path -LiteralPath $rf) { $role = (Get-Content -LiteralPath $rf -Raw).Trim().ToLowerInvariant() }
              & .\scripts\disk-guard.ps1 -Enforce
              if ($role -eq 'standby') {
                  Write-Host "[finalize] 备机（$role）：只做本地完整快照，不写 139"
                  & .\scripts\backup-snapshot.ps1
              } else {
                  & .\scripts\sync-up.ps1
                  & .\scripts\backup-snapshot.ps1 -Push
              }
          }
