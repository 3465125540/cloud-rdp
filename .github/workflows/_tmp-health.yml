name: _tmp-health
# TEMP read-only health probe (deleted right after).
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: pwsh
        env:
          T2: ${{ secrets.POOL_TOKEN_2 }}
          T4: ${{ secrets.POOL_TOKEN_4 }}
          T5: ${{ secrets.POOL_TOKEN_5 }}
        run: |
          $accs = @(
            @{ id='acc-2'; owner='code09101';   tok=$env:T2 },
            @{ id='acc-4'; owner='code1969sda'; tok=$env:T4 },
            @{ id='acc-5'; owner='code19698fgh';tok=$env:T5 }
          )
          $base = 'https://api.github.com'
          function Probe($label, $uri, $token, $method) {
            $H = @{ Authorization = "token $token"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'diag' }
            try {
              $r = Invoke-WebRequest -Headers $H -Uri $uri -Method $method -SkipHttpErrorCheck
              $c = [string]$r.Content
              if ($c.Length -gt 300) { $c = $c.Substring(0, 300) }
              Write-Host ("  {0}: HTTP {1} {2}" -f $label, $r.StatusCode, ($c -replace '\s+', ' '))
            } catch { Write-Host ("  {0}: EXC {1}" -f $label, $_.Exception.Message) }
          }
          foreach ($a in $accs) {
            Write-Host ("===== {0} / {1} =====" -f $a.id, $a.owner)
            if ([string]::IsNullOrWhiteSpace($a.tok)) { Write-Host '  token: <EMPTY>'; continue }
            $o = $a.owner
            Probe 'user'        "$base/user" $a.tok 'GET'
            Probe 'repo'        "$base/repos/$o/cloud-rdp" $a.tok 'GET'
            Probe 'actions.perm' "$base/repos/$o/cloud-rdp/actions/permissions" $a.tok 'GET'
            Probe 'workflows'   "$base/repos/$o/cloud-rdp/actions/workflows" $a.tok 'GET'
            Probe 'runs(3)'     "$base/repos/$o/cloud-rdp/actions/workflows/windows-rdp.yml/runs?per_page=3" $a.tok 'GET'
            Probe 'billing'     "$base/users/$o/settings/billing/usage?year=2026&month=10" $a.tok 'GET'
            # 关键：复现派发（acc-4 预期 422；其余预期 204 —— 真成功也只是 5 分钟的测试机）
            $body = @{ ref = 'main'; inputs = @{ duration_minutes = '5'; pool_role = 'standby';
              pool_owner = $o; pool_id = 'cloud-rdp-pool'; pool_hub = '3465125540/cloud-rdp';
              relay_minutes = '0'; install_apps = 'true'; migrate_139 = 'false';
              slim_image = 'auto'; chinese = 'on' } } | ConvertTo-Json -Depth 5 -Compress
            $H = @{ Authorization = "token $($a.tok)"; Accept = 'application/vnd.github+json';
                    'User-Agent' = 'diag'; 'Content-Type' = 'application/json' }
            try {
              $r = Invoke-WebRequest -Headers $H -Uri "$base/repos/$o/cloud-rdp/actions/workflows/windows-rdp.yml/dispatches" -Method Post -Body $body -SkipHttpErrorCheck
              Write-Host ("  dispatch: HTTP {0}" -f $r.StatusCode)
            } catch { Write-Host ("  dispatch: EXC {0}" -f $_.Exception.Message) }
          }
          Write-Host '===== acc-5 那个 startup_failure 的 check-run 说明 ====='
          Probe 'checkruns' "$base/repos/code19698fgh/cloud-rdp/check-suites/102106102613/check-runs" $env:T5 'GET'
