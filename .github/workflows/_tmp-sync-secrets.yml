name: _tmp sync secrets (auto, one-shot)
on:
  workflow_dispatch:
permissions: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: copy hub secrets to code19698fgh/cloud-rdp
        env:
          GH_TOKEN: ${{ secrets.POOL_TOKEN_5 }}
          TARGET: code19698fgh/cloud-rdp
          S_TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          S_ALIST_139_AUTHORIZATION: ${{ secrets.ALIST_139_AUTHORIZATION }}
          S_GH_RELAY_TOKEN: ${{ secrets.GH_RELAY_TOKEN }}
          S_GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          S_MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          S_MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          S_MAIL_SECURITY: ${{ secrets.MAIL_SECURITY }}
          S_MAIL_USER: ${{ secrets.MAIL_USER }}
          S_MAIL_PASS: ${{ secrets.MAIL_PASS }}
          S_MAIL_FROM: ${{ secrets.MAIL_FROM }}
          S_MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          S_MAIL_TO: ${{ secrets.MAIL_TO }}
          S_MAIL_CC: ${{ secrets.MAIL_CC }}
        run: |
          set -euo pipefail
          gh --version | head -1
          set_one() { name="$1"; val="$2"; if [ -z "$val" ]; then echo "skip $name (empty)"; return 0; fi; gh secret set "$name" --repo "$TARGET" --body "$val" >/dev/null && echo "set $name -> ok"; }
          set_one TAILSCALE_AUTHKEY "$S_TAILSCALE_AUTHKEY"
          set_one ALIST_139_AUTHORIZATION "$S_ALIST_139_AUTHORIZATION"
          set_one GH_RELAY_TOKEN "$S_GH_RELAY_TOKEN"
          set_one GH_BILLING_TOKEN "$S_GH_BILLING_TOKEN"
          set_one MAIL_SMTP_HOST "$S_MAIL_SMTP_HOST"
          set_one MAIL_SMTP_PORT "$S_MAIL_SMTP_PORT"
          set_one MAIL_SECURITY "$S_MAIL_SECURITY"
          set_one MAIL_USER "$S_MAIL_USER"
          set_one MAIL_PASS "$S_MAIL_PASS"
          set_one MAIL_FROM "$S_MAIL_FROM"
          set_one MAIL_FROM_NAME "$S_MAIL_FROM_NAME"
          set_one MAIL_TO "$S_MAIL_TO"
          set_one MAIL_CC "$S_MAIL_CC"
          echo "--- target secret names ---"
          gh secret list --repo "$TARGET"
