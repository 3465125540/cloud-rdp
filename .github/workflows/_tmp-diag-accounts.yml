name: _tmp-diag-accounts
# TEMP diagnostic (created by the workbench session; deleted right after).
# Read-only: probes each account token's identity / repo / Actions / workflow state.
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: pwsh
        env:
          T1: ${{ secrets.POOL_TOKEN_1 }}
          T3: ${{ secrets.POOL_TOKEN_3 }}
          T4: ${{ secrets.POOL_TOKEN_4 }}
          T5: ${{ secrets.POOL_TOKEN_5 }}
        run: |
          $accs = @(
            @{ id='acc-1'; owner='yc1966asgf';   tok=$env:T1 },
            @{ id='acc-3'; owner='3465125540';   tok=$env:T3 },
            @{ id='acc-4'; owner='code1969sda';  tok=$env:T4 },
            @{ id='acc-5'; owner='code19698fgh'; tok=$env:T5 }
          )
          $base = 'https://api.github.com'
          function Show($label, $sb) {
            try { $v = & $sb; Write-Host ("  {0}: {1}" -f $label, $v) }
            catch {
              $resp = $_.Exception.Response; $code = 0
              if ($resp) { try { $code = [int]$resp.StatusCode } catch {} }
              $body = ''
              try { $sr = New-Object System.IO.StreamReader($resp.GetResponseStream()); $body = $sr.ReadToEnd() } catch {}
              Write-Host ("  {0}: ERR {1} {2}" -f $label, $code, (($body -replace '\s+',' ')))
            }
          }
          foreach ($a in $accs) {
            Write-Host ("===== {0} / {1} =====" -f $a.id, $a.owner)
            if ([string]::IsNullOrWhiteSpace($a.tok)) { Write-Host '  token: <EMPTY>'; continue }
            $H = @{ Authorization = "token $($a.tok)"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'diag' }
            Show 'user'    { (Invoke-RestMethod -Headers $H -Uri "$base/user").login }
            Show 'repo'    { $r = Invoke-RestMethod -Headers $H -Uri "$base/repos/$($a.owner)/cloud-rdp"; "private=$($r.private) fork=$($r.fork) default=$($r.default_branch)" }
            Show 'actions' { $p = Invoke-RestMethod -Headers $H -Uri "$base/repos/$($a.owner)/cloud-rdp/actions/permissions"; "enabled=$($p.enabled) allowed=$($p.allowed_actions)" }
            Show 'wfs'     { $w = Invoke-RestMethod -Headers $H -Uri "$base/repos/$($a.owner)/cloud-rdp/actions/workflows"; (($w.workflows | ForEach-Object { "$($_.path)=" + $_.state }) -join ' | ') }
            Show 'runs'    { $rr = Invoke-RestMethod -Headers $H -Uri "$base/repos/$($a.owner)/cloud-rdp/actions/workflows/windows-rdp.yml/runs?per_page=1"; "total=$($rr.total_count)" }
          }
