<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能体工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129302;</text></svg>" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#129302;</span>
      <div>
        <h1>智能体工作台</h1>
        <p class="brand-sub" id="brand-sub">正在连接…</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="pills" id="link-pills"></div>
      <label class="switch" title="自动刷新">
        <input type="checkbox" id="auto-refresh" checked />
        <span>自动刷新</span>
      </label>
      <span class="muted" id="last-updated">—</span>
      <button class="btn btn-primary" id="btn-refresh">刷新</button>
    </div>
  </header>

  <!-- ============ 统计条 ============ -->
  <section class="stats" id="stats"></section>

  <!-- ============ 主网格 ============ -->
  <main class="grid">

    <!-- 机器运行实况 -->
    <section class="card span-7">
      <div class="card-head">
        <h2>&#128421;&#65039; 机器运行实况</h2>
        <div class="head-right">
          <label class="switch" title="历史节点很多，默认只列在线机器">
            <input type="checkbox" id="only-online" checked />
            <span>只看在线</span>
          </label>
          <span class="muted" id="machines-meta"></span>
        </div>
      </div>
      <div class="card-body">
        <table class="tbl" id="tbl-machines">
          <thead>
            <tr>
              <th>主机</th><th>Tailscale IP</th><th>状态</th><th>角色</th>
              <th>快照</th><th>最后在线</th><th class="right">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="empty" id="machines-empty" hidden>暂无机器数据</div>
      </div>
    </section>

    <!-- GitHub 账号管理 -->
    <section class="card span-5">
      <div class="card-head">
        <h2>&#128273; GitHub 账号管理</h2>
        <span class="muted" id="accounts-meta"></span>
      </div>
      <div class="card-body">
        <table class="tbl" id="tbl-accounts">
          <thead>
            <tr>
              <th>账号</th><th>Secret</th><th>角色</th><th>在跑机</th><th class="right">启用</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="empty" id="accounts-empty" hidden>暂无账号数据</div>
      </div>
    </section>

    <!-- 定时计划运行日志 -->
    <section class="card span-12">
      <div class="card-head">
        <h2>&#128197; 定时计划运行日志</h2>
        <div class="tabs" id="run-tabs">
          <button class="tab active" data-tab="keepalive">保活 windows-rdp.yml</button>
          <button class="tab" data-tab="coordinator">协调器 pool-coordinator.yml</button>
        </div>
      </div>
      <div class="card-body">
        <table class="tbl" id="tbl-runs">
          <thead>
            <tr>
              <th>#</th><th>状态</th><th>触发</th><th>开始</th><th>用时</th>
              <th>SHA</th><th>结果</th><th class="right">日志</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="empty" id="runs-empty" hidden>暂无运行记录</div>
      </div>
    </section>

    <!-- 操作台 -->
    <section class="card span-12">
      <div class="card-head"><h2>&#127918; 操作台</h2></div>
      <div class="card-body ops">
        <div class="op-group">
          <h3>账号池协调器</h3>
          <p class="muted">巡检各账号在跑机 → 补足到目标台数 → 到寿轮换 → 发布权威角色。</p>
          <div class="row">
            <button class="btn" data-act="coordinator">立即巡检</button>
            <button class="btn btn-ghost" data-act="coordinator-dry">干跑（只看决策）</button>
          </div>
        </div>

        <div class="op-group">
          <h3>派发保活机</h3>
          <p class="muted">手动开一台机器（单机模式；池模式请用协调器派发）。</p>
          <div class="row">
            <label>时长(分钟)<input type="number" id="inp-duration" value="350" min="1" max="350" /></label>
            <label class="chk"><input type="checkbox" id="inp-install" checked /> 重装软件</label>
            <label class="chk"><input type="checkbox" id="inp-migrate" /> 迁移139</label>
            <button class="btn" data-act="keepalive">派发</button>
          </div>
        </div>

        <div class="op-group">
          <h3>本地</h3>
          <p class="muted">清空缓存后重新拉取全部数据。</p>
          <div class="row">
            <button class="btn btn-ghost" id="btn-refresh2">强制刷新缓存</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="foot">
    <div id="errors" class="errors"></div>
    <div class="muted" id="foot-meta"></div>
  </footer>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
